name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:verify
      - run: pnpm run check

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create deterministic source archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="omp-skill-kit-${version}/" HEAD | gzip -n > "omp-skill-kit-${version}.tar.gz"
          sha256sum "omp-skill-kit-${version}.tar.gz" > "omp-skill-kit-${version}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            omp-skill-kit-*.tar.gz
            omp-skill-kit-*.sha256
