name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run release:package
      - run: pnpm run release:verify
      - run: pnpm run check
      - run: pnpm run test:e2e:loader
      - run: pnpm run test:e2e:release

  windows-e2e:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run release:package
      - run: node scripts/e2e/prepare-runtime.mjs
      - run: pnpm run test:e2e:windows

  docker-e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run release:package
      - run: pnpm run test:e2e:docker

  release:
    needs: [verify, windows-e2e, docker-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run release:package
      - run: pnpm run release:verify
      - name: Generate Consolidated Release Gate Manifest
        run: node scripts/generate-release-manifest.mjs
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            omp-skill-kit-*.tar.gz
            omp-skill-kit-*.sha256
            reports/e2e/**/manifest.json
